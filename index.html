  <header class="topbar">
    <div class="topbar__group">
      <div class="clock" aria-label="Current time">&nbsp;</div>
      <span class="topbar__sep" aria-hidden="true"></span>
      <div class="listeners" aria-hidden="true"><span class="listeners__dot"></span><span class="listeners__count">&nbsp;</span></div>
    </div>
    <div class="link-fetch">
      <input class="link-fetch__input" id="ytLink" type="text" placeholder="Paste YouTube song link&hellip;" autocomplete="off" spellcheck="false" aria-label="Paste YouTube song link"/>
      <button class="link-fetch__btn" id="btnFetchLink" title="Play pasted song">Play</button>
    </div>
    <nav class="links" aria-label="Support and listen elsewhere">
      <a class="support" href="#" title="Support me">Support me</a>
      <a class="link" href="https://music.youtube.com" target="_blank" rel="noopener noreferrer" aria-label="Open YouTube Music" title="YouTube Music">YouTube Music</a>
    </nav>
  </header>

  <main class="shell">
    <div class="brand">
      <p class="brand__eyebrow">Est. 2024 &middot; Made in India</p>
      <h1 class="brand__name">GENZ MUSIC</h1>
      <p class="brand__tag">No signup. No apps. Just press play.</p>
    </div>

    <div class="marquee" aria-hidden="true">
      <div class="marquee__track" id="marqueeTrack">
        <span class="marquee__text" id="marqueeText">Loading playlist&hellip;</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat__label">Listeners</span>
        <span class="stat__value" id="statListeners">&nbsp;</span>
      </div>
      <div class="stat">
        <span class="stat__label">Genre</span>
        <span class="stat__value" id="statGenre">Bollywood</span>
      </div>
      <div class="stat">
        <span class="stat__label">Region</span>
        <span class="stat__value">India</span>
      </div>
    </div>

  </main>

  <div class="playlist-scrim" id="playlistScrim" hidden></div>

  <div class="playlist-panel" id="playlistPanel" hidden>
    <div class="playlist-panel__head">
      <span class="playlist-panel__title">Up Next</span>
      <div class="playlist-panel__tools">
        <div class="playlist-panel__views" role="group" aria-label="Playlist view">
          <button class="pv-btn is-active" id="viewAll" aria-pressed="true">All</button>
          <button class="pv-btn" id="viewFavs" aria-pressed="false">Favourites</button>
        </div>
        <span class="playlist-panel__count" id="playlistCount">&nbsp;</span>
      </div>
    </div>
    <input class="playlist-search" id="playlistSearch" type="search" placeholder="Search song or artist&hellip;" autocomplete="off" aria-label="Search songs"/>
    <ul class="playlist-panel__list" id="playlistList"></ul>
  </div>

    <div class="player-bar" id="playerBar">
    <div class="genre-tab" role="group" aria-label="Genre">
      <button class="genre-tab__btn is-active" data-genre="bollywood" aria-pressed="true">Bollywood</button>
      <button class="genre-tab__btn" data-genre="hollywood" aria-pressed="false">Hollywood</button>
    </div>
    <div class="player-bar__inner">
      <div class="player-bar__left">
        <div class="disc" id="disc" aria-hidden="true">
          <div class="disc__art" id="cover">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff" opacity="0.92"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          </div>
        </div>
        <div class="player-bar__info">
          <p class="player-bar__title" id="trackTitle">&nbsp;</p>
          <p class="player-bar__artist" id="trackArtist">&nbsp;</p>
        </div>
        <button class="fav-toggle" id="btnFav" title="Add to favourites" aria-label="Toggle favourite" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
      </div>

      <div class="player-bar__mid">
        <div class="player-bar__controls">
          <button class="ctl ctl--ghost" id="btnShuffle" title="Shuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button class="ctl" id="btnPrev" title="Previous" aria-label="Previous">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="ctl ctl--play" id="btnPlay" title="Play / Pause" aria-label="Play / Pause">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctl" id="btnNext" title="Next" aria-label="Next">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <button class="ctl ctl--ghost" id="btnRepeat" title="Repeat" aria-label="Repeat">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>
        <div class="player-bar__seek">
          <span class="player-bar__time" id="timeCurrent">0:00</span>
          <div class="rail" id="rail">
            <div class="fill" id="fill" style="width:0%"></div>
          </div>
          <span class="player-bar__time" id="timeTotal">0:00</span>
        </div>
      </div>

      <div class="player-bar__right">
        <button class="list-toggle" id="btnList" title="Show playlist" aria-label="Show playlist" aria-expanded="false" aria-controls="playlistPanel">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h12v2H3z"/></svg>
        </button>
        <div class="player-bar__volume">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" class="vol-icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          <input class="vol" id="volume" type="range" min="0" max="100" value="100" aria-label="Volume"/>
        </div>
      </div>
    </div>
  </div>

  <div class="yt-host" id="ytHost" aria-hidden="true">
    <div id="ytPlayer"></div>
  </div>
